<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="step">
    <span class="step__blob step__blob--tr"></span>
    <span class="step__blob step__blob--bl"></span>

    <div class="step__body">
      <div class="step__hero">
        <div class="step__device">
          <img
            class="step__device-photo"
            src="assets/images/onboarding/car-mockup.png"
            alt="Verified cars preview"
          />
        </div>

        
      </div>

      <div class="step__content">
        <p class="step__eyebrow">STEP 02</p>
        <h1 class="step__title">
          Buy or Rent<br />
          <span class="step__title--accent">Verified</span> Cars.
        </h1>
      </div>
    </div>

    <div class="step__footer">
      <div class="step__dots" aria-hidden="true">
        <span class="step__dot"></span>
        <span class="step__dot step__dot--active"></span>
        <span class="step__dot"></span>
      </div>

      <div class="step__actions">
        <button type="button" class="step__primary" (click)="goToNext()">Continue</button>
        <button type="button" class="step__secondary" (click)="skip()">Skip</button>
      </div>
    </div>
  </div>
</ion-content>
