<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="onboarding-container">
    <!-- Skip button -->
    <div class="skip-bar">
      <button class="skip-btn" (click)="skip()">Skip</button>
    </div>

    <!-- Image area -->
    <div class="image-area">
      <div class="image-placeholder">
        <img src="assets/images/onboarding-parking.jpg" alt="Find Perfect Parking" onerror="this.style.display='none'; this.parentElement.classList.add('fallback')" />
      </div>
    </div>

    <!-- Content area -->
    <div class="content-area">
      <h2 class="title">Find Perfect Parking</h2>
      <p class="description">
        Book secure spots in seconds anywhere in the city. Save time and never worry about parking again.
      </p>
    </div>

    <!-- Bottom area -->
    <div class="bottom-area">
      <!-- Dots indicator -->
      <div class="dots">
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>

      <!-- Next Button -->
      <button class="next-btn" (click)="goToNext()">
        Next
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
</ion-content>
