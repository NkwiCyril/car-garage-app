<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="form-container">

    <!-- Header -->
    <div class="header-section">
      <button class="back-btn" (click)="goBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
    </div>

    <!-- Title -->
    <div class="title-section">
      <h1 class="title">Park a Car</h1>
      <p class="subtitle">Store your vehicle safely in the DriveEase garage</p>
    </div>

    <!-- Info Banner -->
    <div class="info-banner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="info-icon">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <p>Your car will be kept privately in your garage. You can collect it at any time from My Cars.</p>
    </div>

    <!-- Vehicle Details -->
    <p class="section-label">Vehicle Details</p>

    <div class="input-group">
      <label class="input-label">Make <span class="required">*</span></label>
      <ion-input
        class="de-input"
        type="text"
        placeholder="e.g. Toyota"
        [(ngModel)]="make"
        fill="outline"
        mode="md"
      ></ion-input>
    </div>

    <div class="input-group">
      <label class="input-label">Model <span class="required">*</span></label>
      <ion-input
        class="de-input"
        type="text"
        placeholder="e.g. Land Cruiser"
        [(ngModel)]="model"
        fill="outline"
        mode="md"
      ></ion-input>
    </div>

    <div class="input-group">
      <label class="input-label">Year <span class="required">*</span></label>
      <ion-input
        class="de-input"
        type="number"
        placeholder="e.g. 2021"
        [(ngModel)]="yearStr"
        fill="outline"
        mode="md"
      ></ion-input>
    </div>

    <div class="input-group">
      <label class="input-label">VIN <span class="required">*</span></label>
      <ion-input
        class="de-input"
        type="text"
        placeholder="e.g. 1HGBH41JXMN109186"
        [(ngModel)]="vin"
        fill="outline"
        mode="md"
      ></ion-input>
    </div>

    <div class="input-group">
      <label class="input-label">Estimated Value (CFA)</label>
      <ion-input
        class="de-input"
        type="number"
        placeholder="e.g. 12000000"
        [(ngModel)]="priceStr"
        fill="outline"
        mode="md"
      ></ion-input>
    </div>

    <!-- Description -->
    <p class="section-label">Description</p>

    <div class="input-group">
      <label class="input-label">Additional Notes (optional)</label>
      <textarea
        class="de-textarea"
        placeholder="e.g. Service due in 3 months, needs tyre change..."
        [(ngModel)]="description"
        rows="3"
      ></textarea>
    </div>

    <!-- Photos -->
    <p class="section-label">Photos <span class="section-hint">(up to 5)</span></p>

    <div class="input-group">
      <input
        type="file"
        accept="image/*"
        multiple
        #fileInput
        (change)="onFilesSelected($event)"
        style="display:none"
      />

      <div class="upload-zone" (click)="fileInput.click()" *ngIf="selectedFiles.length < 5">
        <ion-icon name="cloud-upload-outline"></ion-icon>
        <span class="upload-label">Tap to upload photos</span>
        <span class="upload-hint">{{ selectedFiles.length }}/5 added</span>
      </div>

      <div class="image-previews" *ngIf="imagePreviews.length > 0">
        <div class="preview-item" *ngFor="let url of imagePreviews; let i = index">
          <img [src]="url" alt="Preview {{ i + 1 }}" />
          <button class="remove-preview" (click)="removeImage(i)">
            <ion-icon name="close-outline"></ion-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <button class="submit-btn" (click)="submit()" [disabled]="isLoading">
      <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      <span *ngIf="!isLoading">Park Car</span>
    </button>

  </div>
</ion-content>
