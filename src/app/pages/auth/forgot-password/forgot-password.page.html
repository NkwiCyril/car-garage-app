<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="forgot-container">
    <!-- Header -->
    <div class="header-section">
      <button class="back-btn" (click)="goBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Icon -->
    <div class="icon-section">
      <div class="icon-circle">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <div class="title-section">
      <h1 class="title">Forgot Password</h1>
      <p class="subtitle">Enter your phone number and we'll send you a verification code to reset your password.</p>
    </div>

    <!-- Form -->
    <div class="form-section">
      <div class="input-group">
        <label class="input-label">Phone Number</label>
        <ion-input
          class="de-input"
          type="tel"
          placeholder="Enter your phone number"
          [(ngModel)]="phone"
          fill="outline"
          mode="md"
        ></ion-input>
      </div>

      <!-- Send OTP Button -->
      <button class="send-btn" (click)="sendOtp()">Send Verification Code</button>
    </div>

    <!-- Back to login -->
    <div class="back-section">
      <p>Remember your password? <a (click)="goBack()" class="de-link">Login</a></p>
    </div>
  </div>
</ion-content>
