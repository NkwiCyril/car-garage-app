<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="reset">
    <!-- Decorative blobs -->
    <span class="reset__blob reset__blob--blue"></span>
    <span class="reset__blob reset__blob--gray"></span>

    <!-- Back button -->
    <div class="reset__nav">
      <button class="reset__back" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Title -->
    <div class="reset__welcome">
      <h1 class="reset__title">
        Reset<br/>
        <span class="reset__title--accent">Password</span>
      </h1>
      <p class="reset__subtitle">
        Enter the phone number associated with
        your account to receive a verification
        code.
      </p>
    </div>

    <!-- Form -->
    <div class="reset__form">
      <div class="reset__field">
        <label class="reset__label">PHONE NUMBER</label>
        <div class="reset__phone-row">
          <button class="reset__country-code">
            <span>+237</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>
          <ion-input
            class="reset__input reset__input--phone"
            type="tel"
            placeholder="6XX XXX XXX"
            [(ngModel)]="phone"
            fill="outline"
            mode="md"
          ></ion-input>
        </div>
      </div>

      <!-- Send button -->
      <button class="reset__btn" (click)="sendOtp()" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <ng-container *ngIf="!isLoading">
          <span>Send Code</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </ng-container>
      </button>
    </div>

    <!-- Support link -->
    <div class="reset__support">
      <p>Having trouble?
        <a class="reset__support-link" (click)="contactSupport()">Contact Support</a>
      </p>
    </div>
  </div>
</ion-content>
