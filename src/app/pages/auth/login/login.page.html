<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="login">
    <!-- Top spacer area -->
    <div class="login__header"></div>

    <!-- Welcome -->
    <div class="login__welcome">
      <h1 class="login__title">ParkEase</h1>
      <p class="login__subtitle">
        Sign in to your account to access exclusive
        valet and marketplace services.
      </p>
    </div>

    <!-- Form -->
    <div class="login__form">
      <!-- Phone -->
      <div class="login__field">
        <label class="login__label">PHONE NUMBER</label>
        <div class="login__phone-row">
          <div class="login__country-code">
            <span>+237</span>
          </div>
          <ion-input
            class="login__input login__input--phone"
            type="tel"
            placeholder="6XX XXX XXX"
            [(ngModel)]="phone"
            fill="outline"
            mode="md"
          ></ion-input>
        </div>
      </div>

      <!-- Password -->
      <div class="login__field">
        <div class="login__label-row">
          <label class="login__label">PASSWORD</label>
          <a class="login__forgot" (click)="goToForgotPassword()">Forgot Password?</a>
        </div>
        <ion-input
          class="login__input"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="password"
          fill="outline"
          mode="md"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <!-- Login button -->
      <button class="login__btn" (click)="login()" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <ng-container *ngIf="!isLoading">
          <span>Login</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </ng-container>
      </button>
    </div>

    <!-- Register -->
    <div class="login__register">
      <p>Don't have an account?
        <a class="login__register-link" (click)="goToRegister()">Create Account</a>
      </p>
    </div>
  </div>
</ion-content>
