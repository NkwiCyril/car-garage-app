<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="newpw">
    <!-- Back button -->
    <div class="newpw__nav">
      <button class="newpw__back" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Title -->
    <div class="newpw__welcome">
      <h1 class="newpw__title">New Password</h1>
      <p class="newpw__subtitle">
        Create a strong, secure password to
        protect your account.
      </p>
    </div>

    <!-- Form -->
    <div class="newpw__form">
      <div class="newpw__field">
        <label class="newpw__label">New Password</label>
        <ion-input
          class="newpw__input"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="newPassword"
          fill="outline"
          mode="md"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <div class="newpw__field">
        <label class="newpw__label">Confirm New Password</label>
        <ion-input
          class="newpw__input"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="repeatPassword"
          fill="outline"
          mode="md"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <!-- Requirements card -->
      <div class="newpw__requirements">
        <p class="newpw__requirements-title">PASSWORD REQUIREMENTS</p>
        <ul class="newpw__requirements-list">
          <li class="newpw__requirement">
            <span class="newpw__requirement-dot"></span>
            8+ characters
          </li>
          <li class="newpw__requirement">
            <span class="newpw__requirement-dot"></span>
            At least one number
          </li>
          <li class="newpw__requirement">
            <span class="newpw__requirement-dot"></span>
            One special character
          </li>
          <li class="newpw__requirement">
            <span class="newpw__requirement-dot"></span>
            One uppercase letter
          </li>
        </ul>
      </div>

      <!-- Update button -->
      <button class="newpw__btn" (click)="resetPassword()" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Update Password</span>
      </button>
    </div>

    <!-- Support link -->
    <div class="newpw__support">
      <p>Need help?
        <a class="newpw__support-link" (click)="contactSupport()">Contact support</a>
      </p>
    </div>
  </div>
</ion-content>
