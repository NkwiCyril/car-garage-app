<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="reset-container">
    <!-- Header -->
    <div class="header-section">
      <button class="back-btn" (click)="goBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Icon -->
    <div class="icon-section">
      <div class="icon-circle">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <div class="title-section">
      <h1 class="title">Reset Password</h1>
      <p class="subtitle">Create a new password for your account. Make sure it's strong and secure.</p>
    </div>

    <!-- Form -->
    <div class="form-section">
      <div class="input-group">
        <label class="input-label">New Password</label>
        <ion-input
          class="de-input"
          type="password"
          placeholder="Enter new password"
          [(ngModel)]="newPassword"
          fill="outline"
          mode="md"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <div class="input-group">
        <label class="input-label">Confirm Password</label>
        <ion-input
          class="de-input"
          type="password"
          placeholder="Confirm new password"
          [(ngModel)]="reapeatPassword"
          fill="outline"
          mode="md"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <!-- Reset Button -->
      <button class="reset-btn" (click)="resetPassword()">Reset Password</button>
    </div>
  </div>
</ion-content>
