<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="otp">
    <!-- Back button -->
    <div class="otp__nav">
      <button class="otp__back" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Lock icon -->
    <div class="otp__icon">
      <div class="otp__icon-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0043eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <div class="otp__welcome">
      <h1 class="otp__title">Verify Your Phone</h1>
      <p class="otp__subtitle">
        Enter the code we sent to <strong>{{ maskedPhone }}</strong>
      </p>
    </div>

    <!-- OTP Inputs -->
    <div class="otp__boxes">
      <ion-input
        id="otp1"
        class="otp__box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp1"
        (ionInput)="onOtpInput($event, 'otp2')"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp2"
        class="otp__box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp2"
        (ionInput)="onOtpInput($event, 'otp3')"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp3"
        class="otp__box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp3"
        (ionInput)="onOtpInput($event, 'otp4')"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp4"
        class="otp__box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp4"
        (ionInput)="onOtpInput($event, 'otp5')"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp5"
        class="otp__box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp5"
        (ionInput)="onOtpInput($event, null)"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp6"
        class="otp__box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp6"
        (ionInput)="onOtpInput($event, null)"
        fill="outline"
        mode="md"
      ></ion-input>
    </div>

    <!-- Countdown -->
    <div class="otp__timer">
      <svg class="otp__timer-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="otp__timer-text">RESEND CODE IN <span class="otp__timer-count">{{ countdownDisplay }}</span></span>
    </div>

    <!-- Resend -->
    <p class="otp__resend">
      Didn't receive the code?
      
       <a class="otp__resend-link"
        [class.otp__resend-link--disabled]="countdown > 0"
        (click)="countdown <= 0 && resendOtp()"
      >Resend</a>
    </p>

    <!-- Verify button -->
    <div class="otp__actions">
      <button class="otp__btn" (click)="verifyOtp()" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <ng-container *ngIf="!isLoading">
          <span>Verify</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </ng-container>
      </button>
    </div>    
  </div>
</ion-content>
