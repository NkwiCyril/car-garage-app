<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="otp-container">
    <!-- Header -->
    <div class="header-section">
      <button class="back-btn" (click)="goBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Icon -->
    <div class="icon-section">
      <div class="icon-circle">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <div class="title-section">
      <h1 class="title">Verify OTP</h1>
      <p class="subtitle">We've sent a 4-digit verification code to your phone number. Enter it below.</p>
    </div>

    <!-- OTP Inputs -->
    <div class="otp-inputs">
      <ion-input
        id="otp1"
        class="otp-box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp1"
        (ionInput)="onOtpInput($event, 'otp2')"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp2"
        class="otp-box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp2"
        (ionInput)="onOtpInput($event, 'otp3')"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp3"
        class="otp-box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp3"
        (ionInput)="onOtpInput($event, 'otp4')"
        fill="outline"
        mode="md"
      ></ion-input>
      <ion-input
        id="otp4"
        class="otp-box"
        type="tel"
        maxlength="1"
        [(ngModel)]="otp4"
        (ionInput)="onOtpInput($event, null)"
        fill="outline"
        mode="md"
      ></ion-input>
    </div>

    <!-- Verify Button -->
    <div class="action-section">
      <button class="verify-btn" (click)="verifyOtp()">Verify</button>
    </div>

    <!-- Resend -->
    <div class="resend-section">
      <p>Didn't receive the code? <a (click)="resendOtp()" class="de-link">Resend</a></p>
    </div>
  </div>
</ion-content>
