<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="signup">
    <!-- Header spacer -->
    <div class="signup__header"></div>

    <!-- Welcome -->
    <div class="signup__welcome">
      <h1 class="signup__title">ParkEase</h1>
      <p class="signup__subtitle">
        Create your account to access exclusive valet
        and marketplace services.
      </p>
    </div>

    <!-- Form -->
    <div class="signup__form">
      <!-- Full Name -->
      <div class="signup__field">
        <label class="signup__label">FULL NAME</label>
        <ion-input
          class="signup__input"
          type="text"
          placeholder="Samuel Eto'o"
          [(ngModel)]="fullName"
          fill="outline"
          mode="md"
        ></ion-input>
      </div>

      <!-- Phone -->
      <div class="signup__field">
        <label class="signup__label">PHONE NUMBER</label>
        <div class="signup__phone-row">
          <div class="signup__country-code">
            <span>+237</span>
          </div>
          <ion-input
            class="signup__input signup__input--phone"
            type="tel"
            placeholder="6XX XXX XXX"
            [(ngModel)]="phone"
            fill="outline"
            mode="md"
          ></ion-input>
        </div>
      </div>

      <!-- Password -->
      <div class="signup__field">
        <label class="signup__label">PASSWORD</label>
        <ion-input
          class="signup__input"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="password"
          fill="outline"
          mode="md"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <!-- Confirm Password -->
      <div class="signup__field">
        <label class="signup__label">CONFIRM PASSWORD</label>
        <ion-input
          class="signup__input"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="confirmPassword"
          fill="outline"
          mode="md"
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <!-- Register button -->
      <button class="signup__btn" (click)="register()" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <ng-container *ngIf="!isLoading">
          <span>Create Account</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </ng-container>
      </button>
    </div>

    <!-- Login link -->
    <div class="signup__login">
      <p>Already have an account?
        <a class="signup__login-link" (click)="goToLogin()">Sign In</a>
      </p>
    </div>
  </div>
</ion-content>
