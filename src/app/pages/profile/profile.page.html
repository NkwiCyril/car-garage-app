<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="profile-wrap">

    <!-- ─── Hero Banner ──────────────────────────────────── -->
    <div class="profile-hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <div class="avatar-ring">
          <div class="avatar-inner">
            <span>{{ (userName.charAt(0) || 'D').toUpperCase() }}</span>
          </div>
        </div>
        <div class="hero-info">
          <h1 class="hero-name">{{ userName || 'Driver' }}</h1>
          <p class="hero-phone">{{ userPhone || 'No phone number' }}</p>
        </div>
        <button class="edit-btn">
          <ion-icon name="create-outline"></ion-icon>
        </button>
      </div>
    </div>

    <!-- ─── Stats ────────────────────────────────────────── -->
    <div class="stats-band">
      <div class="stat-item">
        <span class="stat-val">12</span>
        <span class="stat-lbl">Bookings</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span class="stat-val">3</span>
        <span class="stat-lbl">Vehicles</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span class="stat-val">2</span>
        <span class="stat-lbl">Favorites</span>
      </div>
    </div>

    <!-- ─── Menu Sections ────────────────────────────────── -->
    <div class="profile-body">

      <div class="menu-card">
        <div class="menu-item" *ngFor="let item of menuItems" (click)="onMenuItemClick(item)">
          <div class="menu-ico-wrap">
            <ion-icon [name]="item.icon"></ion-icon>
          </div>
          <div class="menu-text">
            <span class="menu-label">{{ item.label }}</span>
            <span class="menu-sub">{{ item.subtitle }}</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="menu-arrow"></ion-icon>
        </div>
      </div>

      <!-- Logout -->
      <button class="logout-btn" (click)="confirmLogout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Log Out</span>
      </button>

      <p class="app-ver">DriveEase v1.0.0</p>

    </div>
  </div>
</ion-content>
