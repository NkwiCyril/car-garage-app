<ion-content [fullscreen]="true" [scrollY]="true">
  <div class="dashboard-container">

    <!-- Header -->
    <div class="header-section">
      <div class="header-top">
        <div class="logo-section">
          <ion-icon name="grid-outline" class="menu-icon"></ion-icon>
          <h1 class="app-title">DriveEase</h1>
        </div>
        <div class="header-actions">
          <button class="notification-btn" (click)="openNotifications()">
            <ion-icon name="notifications-outline"></ion-icon>
            <span class="notif-badge"></span>
          </button>
          <div class="avatar-circle">
            <span>{{ userName.charAt(0) || 'U' }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-overlay">
        <span class="hero-badge">NEW SERVICES</span>
        <h2 class="hero-title">Simplify Your Daily Tasks</h2>
        <p class="hero-subtitle">Manage parking, rentals and auto care in one seamless experience.</p>
      </div>
    </div>

    <!-- Featured Services -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Featured Services</h2>
        <a class="see-all-link" (click)="viewAllServices()">View all</a>
      </div>

      <div class="featured-services">
        <div class="service-card" *ngFor="let service of featuredServices">
          <div class="service-icon" [ngClass]="service.iconClass">
            <ion-icon [name]="service.icon"></ion-icon>
          </div>
          <div class="service-content">
            <h3 class="service-title">{{ service.title }}</h3>
            <p class="service-description">{{ service.description }}</p>
            <div class="service-footer">
              <span class="service-meta" [ngClass]="service.metaClass">{{ service.meta }}</span>
              <button class="service-btn" (click)="navigateTo(service.route)">
                {{ service.buttonText }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="section">
      <h2 class="section-title">Quick Actions</h2>
      <div class="quick-actions-grid">
        <div
          class="action-card"
          *ngFor="let action of quickActions"
          (click)="navigateTo(action.route)"
        >
          <div class="action-icon">
            <ion-icon [name]="action.icon"></ion-icon>
          </div>
          <span class="action-label">{{ action.label }}</span>
        </div>
      </div>
    </div>

  </div>
</ion-content>
